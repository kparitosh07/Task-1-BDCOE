<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CineFind</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <a href="#" class="logo">🎬 Cine<span>Find</span></a>
        <nav>
            <a href="#home">Home</a>
            <a href="#movies">Movies</a>
        </nav>
    </header>

    <section id="home" class="hero">
        <small>● MOVIE DISCOVERY</small>
        <h1>Find Your Next<br><span>Favorite Movie</span></h1>
        <p>Search movies and discover something amazing.</p>

        <form id="searchForm">
            🔍
            <input id="movieInput" placeholder="Search for a movie..." required>
            <button type="button" id="clear">×</button>
            <button>Search</button>
        </form>
    </section>

    <main id="movies">
        <div class="heading">
            <h2>Explore <span>Cinema</span></h2>
            <b id="count"></b>
        </div>

        <div id="loader" class="loader hidden">
            <div></div> Searching...
        </div>

        <div id="error" class="error hidden"></div>

        <div id="empty" class="empty">
            🎬
            <h3>What will you watch tonight?</h3>
            <p>Search for a movie to explore.</p>
        </div>

        <div id="grid" class="grid"></div>
    </main>

    <div id="modal" class="modal hidden">
        <div class="modal-box">
            <button id="close">×</button>
            <div id="details"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Finder</title>

<body>
    <div class="container">
        <h1>Movie Finder</h1>
        <div class="search">
            <input type="text" id="searchInput" placeholder="Search for a movie...">
            <button id="searchBtn">Search</button>
        </div>

        <div class="results" id="results">
            <h2>Recommendations</h2>
            <div class="two_grid" id="recommendations">
            
            </div>
            
            <h2>Movies</h2>

            <div class="grids" id="movieGrid">

            </div>
        </div>
    </div>
</body>
</html>
